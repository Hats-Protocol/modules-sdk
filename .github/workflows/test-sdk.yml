name: test-sdk
on:
  pull_request:
    branches:
      - main

jobs:
  test-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Start Anvil Fork
        run: anvil --fork-url ${{ secrets.SEPOLIA_RPC }} --port 8545 &

      - name: Wait for Anvil
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8545 -X POST -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' > /dev/null 2>&1; then
              echo "Anvil is ready"
              exit 0
            fi
            echo "Waiting for Anvil... ($i/30)"
            sleep 1
          done
          echo "Anvil failed to start"
          exit 1

      - name: Run Tests
        run: pnpm test
